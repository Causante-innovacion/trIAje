version: '3.8'

services:
  # 🐍 LA CAJA DEL BACKEND
  backend:
    build: ./backend              # Construye usando la receta de la carpeta backend
    container_name: gpt_legal_backend
    # ports:
      # - "8000:8000"             # 🔒 COMENTADO POR SEGURIDAD EN PRODUCCIÓN
                                  # Solo descomenta si necesitas probar el backend directo (Swagger)
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/gpt_legal.db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MAPLE_API_KEY=${MAPLE_API_KEY}
      - MAPLE_API_URL=http://maple-proxy:8080/v1
      - PROVIDER_REASONING=maple
      - MODEL_REASONING=deepseek-r1-0528
      - PROVIDER_INTAKE=openai
      - MODEL_INTAKE=gpt-4o-mini
    volumes:
      - ./backend_data:/app/data  
    depends_on:
      - qdrant
      - maple-proxy
    restart: unless-stopped
    networks:
      - default
      - red-externa

  # 🎨 LA CAJA DEL FRONTEND
  frontend:
    build: ./frontend
    container_name: gpt_legal_frontend
    ports:
      - "8090:80"                 # 🌍 ESTE ES EL ÚNICO PUERTO PÚBLICO
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - default
      - red-externa

  # 🔒 MAPLE PROXY — Puerta de entrada segura a DeepSeek R1 (TEE encriptado)
  # Requiere que el backend apunte a: MAPLE_API_URL=http://maple-proxy:8080/v1
  # Documentación: https://blog.trymaple.ai/maple-proxy-documentation/
  maple-proxy:
    image: ghcr.io/opensecretcloud/maple-proxy:latest
    container_name: gpt_legal_maple_proxy
    # Sin ports — el backend lo alcanza por red interna Docker (http://maple-proxy:8080/v1)
    environment:
      - MAPLE_BACKEND_URL=https://enclave.trymaple.ai
      - MAPLE_ENABLE_CORS=true
      - RUST_LOG=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  # 🧠 LA CAJA DE LA MEMORIA (Qdrant)
  # Dashboard: http://localhost:6333/dashboard
  qdrant:
    image: qdrant/qdrant:latest
    container_name: gpt_legal_qdrant
    ports:
      - "127.0.0.1:6333:6333"    # REST API + Dashboard GUI (solo local/SSH tunnel)
      - "127.0.0.1:6334:6334"    # gRPC (solo local/SSH tunnel)
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped


# Volúmenes persistentes
volumes:
  qdrant_data:
networks:
  default:
    driver: bridge
  red-externa:
    name: red-interna-causante
    external: true