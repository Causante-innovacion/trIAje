version: '3.8'

services:
  # 🐍 LA CAJA DEL BACKEND
  backend:
    build: ./backend              # Construye usando la receta de la carpeta backend
    container_name: gpt_legal_backend
    # ports:
      # - "8000:8000"             # 🔒 COMENTADO POR SEGURIDAD EN PRODUCCIÓN
                                  # Solo descomenta si necesitas probar el backend directo (Swagger)
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/gpt_legal.db
      - CHROMA_MODE=server
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CHROMA_TOKEN=${CHROMA_TOKEN}
    volumes:
      - ./backend_data:/app/data  
    depends_on:
      - chromadb
    restart: unless-stopped

  # 🎨 LA CAJA DEL FRONTEND
  frontend:
    build: ./frontend
    container_name: gpt_legal_frontend
    ports:
      - "5173:80"                 # 🌍 ESTE ES EL ÚNICO PUERTO PÚBLICO
    depends_on:
      - backend
    restart: unless-stopped

  # 🧠 LA CAJA DE LA MEMORIA (ChromaDB)
  chromadb:
    image: chromadb/chroma:latest
    container_name: gpt_legal_chromadb
    ports:
      - "8001:8000"               # ⚠️ SOLO DESARROLLO - Cierra en producción
    volumes:
      - chromadb_data:/chroma/chroma 
    environment:
      - IS_PERSISTENT=TRUE
      # 🔐 Autenticación por Token
      - CHROMA_SERVER_AUTHN_PROVIDER=chromadb.auth.token_authn.TokenAuthenticationServerProvider
      - CHROMA_SERVER_AUTHN_CREDENTIALS=${CHROMA_TOKEN}
      - CHROMA_AUTH_TOKEN_TRANSPORT_HEADER=AUTHORIZATION

    restart: unless-stopped

  # 📊 VISUALIZACIÓN DE CHROMADB (chromadb-admin)
  chromadb-admin:
    build: https://github.com/flanker/chromadb-admin.git
    container_name: gpt_legal_chromadb_admin
    ports:
      - "3001:3001"               # ⚠️ SOLO DESARROLLO - Cierra en producción
    environment:
      # chromadb-admin necesita saber dónde está Chroma y su token
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
    depends_on:
      - chromadb
    restart: unless-stopped


# Aquí definimos los volúmenes persistentes
volumes:
  chromadb_data: