server {
    listen 80;

    # Tipos MIME correctos
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    root /usr/share/nginx/html;
    index index.html;

    # Las peticiones llegan con prefijo /gpt-legal/ desde el reverse proxy.
    # Lo quitamos internamente para que Nginx encuentre los archivos.
    location /gpt-legal/ {
        rewrite ^/gpt-legal/(.*)$ /$1 last;
    }

    # Archivos estáticos (JS, CSS, imágenes) - 404 real si no existen
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # API Proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE / streaming: desactivar buffering para que los tokens lleguen en tiempo real
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # SPA routing - todo lo demás devuelve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
