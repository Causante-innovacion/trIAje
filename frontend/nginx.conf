server {
    listen 80;

    # Tipos MIME correctos
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Aumentar tamaño máximo de subida para permitir PDFs grandes
    client_max_body_size 50M;

    root /usr/share/nginx/html;
    index index.html;

    # ── API Proxy ─────────────────────────────────────────────────────────────
    # IMPORTANTE: debe ir ANTES del bloque /trIAje/ para tener mayor prioridad.
    # Captura tanto /trIAje/api/ como /api/ por si acaso.
    location /trIAje/api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE / streaming: desactivar buffering para que los tokens lleguen en tiempo real
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # ── Archivos estáticos ────────────────────────────────────────────────────
    location /trIAje/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # ── SPA routing ───────────────────────────────────────────────────────────
    # Todo lo demás (incluyendo /trIAje/*) devuelve index.html para el router de React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
